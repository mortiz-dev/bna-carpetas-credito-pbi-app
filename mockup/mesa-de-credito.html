const amountsByMonth=[4200,4460,4310,4650,4790,5050,5320,5160,5480,5600,5840,5730,5500,5660,5820,5990,6110,6040,5780,5610,5480,5270,5060,5250];
function periodAt(index){
  const dt=new Date(Date.UTC(2024,10+index,1));
  return String(dt.getUTCFullYear())+String(dt.getUTCMonth()+1).padStart(2,'0');
}
function periodLabel(key){
  return new Intl.DateTimeFormat('es-AR',{month:'short',year:'2-digit',timeZone:'UTC'}).format(new Date(Date.UTC(+key.slice(0,4),+key.slice(4)-1,1))).replace(' de ',' ');
}
function sampleBcra(r,holder=0){
  if(r.limit===null||holder>0)return null;
  const detailed=r.id===closedExample;
  const scale=(r.index+1)*750/5250;
  const periodos=amountsByMonth.map((base,i)=>{
    const total=Math.round(base*scale),first=Math.round(total*0.64);
    return {periodo:periodAt(i),entidades:[
      {entidad:'Banco del Estuario',monto:first,situacion:1},
      {entidad:'Financiera del Centro',monto:total-first,situacion:detailed&&i>=20?2:1}
    ]};
  });
  const last=periodos[periodos.length-1];
  const current=last.entidades.map((e,i)=>({...e,diasAtraso:detailed&&i===1?38:0,enRevision:detailed&&i===1,procesoJud:false}));
  const checks=detailed?[{causal:'Defectos formales',nroCheque:80031,monto:185000,fechaRechazo:'05 nov 2026',fechaPago:'11 nov 2026',fechaPagoMulta:'12 nov 2026',estadoMulta:null}]:[];
  return {periodos,periodo:last.periodo,entidades:current,checks,consulta:detailed?'20 nov 2026':'26 nov 2026'};
}
function totalDebt(rows){return rows.reduce((sum,e)=>sum+e.monto,0)}
function historyGraph(periodos,range){

  const ceiling=Math.max(500,Math.ceil(Math.max(...values)/500)*500);
  const label=i=>values[i]===null?'sin información':number(values[i])+' miles de ARS';
  const bars=slice.map((p,i)=>'<div class="hist-col"><i style="height:'+(values[i]===null?0:100*values[i]/ceiling)+'%" title="'+periodLabel(p.periodo)+' · '+label(i)+'"></i></div>').join('');
  const lines=slice.map((p,i)=>'<tr><td>'+periodLabel(p.periodo)+'</td><td>'+(values[i]===null?'Sin información':number(values[i]))+'</td><td>'+(p.entidades.length?Math.max(...p.entidades.map(e=>e.situacion)):'—')+'</td></tr>').join('');
  return '<section class="case-card trend"><div class="chart-title"><div><h3>Evolución de la deuda</h3><small>Miles de ARS · suma por período</small></div><label><span class="sr-only">Período del gráfico</span><select id="historyRange">'+[6,12,24].map(n=>'<option value="'+n+'" '+(n===range?'selected':'')+'>'+n+' meses</option>').join('')+'</select></label></div><div class="bars" role="img" aria-label="Deuda desde '+periodLabel(slice[0].periodo)+' hasta '+periodLabel(slice.at(-1).periodo)+', de '+label(0)+' a '+label(slice.length-1)+'."><div class="yscale"><span>'+number(ceiling)+'</span><span>'+number(ceiling/2)+'</span><span>0</span></div><div class="hist-plot">'+bars+'</div></div><div class="xscale"><span>'+periodLabel(slice[0].periodo)+'</span><span>'+periodLabel(slice.at(-1).periodo)+'</span></div><details class="chart-data"><summary>Ver valores por mes</summary><table class="compare"><thead><tr><th>Período</th><th>Miles de ARS</th><th>Mayor situación</th></tr></thead><tbody>'+lines+'</tbody></table></details></section>';

function realHistory(periods,range){
  const last=periods.at(-1).periodo;
  const monthIndex=Number(last.slice(0,4))*12+Number(last.slice(4))-1;
  const mapped=new Map(periods.filter(p=>p.entidades.length).map(p=>[p.periodo,p]));
  const calendar=Array.from({length:range},(_,i)=>{
    const m=monthIndex-range+i+1;
    const key=String(Math.floor(m/12))+String(m%12+1).padStart(2,'0');
    return mapped.get(key)||{periodo:key,entidades:[]};
  });
  return historyGraph(calendar,range);
}

}
const detailSections=['Evaluación','Power BI','BCRA','Consultas IA','Dictamen'];
function detail(r,tab=0){
  if(!r)return;
  active=r;detailTab=tab;
  modal.classList.add('case-dialog');
  const tabs=detailSections.map((s,i)=>'<button data-tab="'+i+'" aria-pressed="'+(i===tab)+'" class="'+(i===tab?'active':'')+'">'+s+'</button>').join('');
  show('<header class="case-head"><div class="dialogbar"><div><div class="eyebrow">'+icons.FolderOpen+' Carpeta '+r.id+' · Datos ficticios</div><div class="case-titlebar"><h2 id="dialogTitle">'+esc(r.name)+'</h2>'+status(r)+'</div></div>'+closeBtn()+'</div><div class="case-meta"><b>Área · '+areas[r.area].label+'</b><span>Segmento · '+r.segment+'</span><span>'+r.holders+' titular'+(r.holders===1?'':'es')+'</span></div><nav class="tabs detailtab" aria-label="Secciones de la carpeta">'+tabs+'</nav></header><div class="detailpane" id="pane"></div>');
  const pages=[overview,powerView,bcraView,assistant,opinionView];
  const pane=document.querySelector('#pane');
  pane.innerHTML=pages[tab](r);
  if(tab===1||tab===2){
    const next=tab===1?2:4;
    pane.insertAdjacentHTML('beforeend','<div class="foot"><button data-tab="0" class="btn">Volver a evaluación</button><button data-tab="'+next+'" class="primary">'+(tab===1?'Consultar BCRA':'Ir al dictamen')+' '+icons.ArrowRight+'</button></div>');
  }
  modal.scrollTop=0;
}
function newForm(){active=null;modal.classList.remove('case-dialog');show('<div class="dialogbar"><div><span class="tag">Alta de demostración</span><h2 id="dialogTitle">Nueva carpeta</h2></div>'+closeBtn()+'</div><form class="forms stack" id="newform"><label>Empresa ficticia<input class="field" name="name" maxlength="65" required pattern=".*\\S.*" placeholder="Nombre de ejemplo"></label><label>Área responsable<select name="area" aria-label="Área responsable"><option value="py" '+(area!=='ge'?'selected':'')+'>MiPyMEs</option><option value="ge" '+(area==='ge'?'selected':'')+'>Grandes Empresas</option></select></label><label>Segmento<select name="segment" aria-label="Segmento"><option>MiPyME</option><option>Gran empresa</option></select></label><label>Cantidad de titulares<input class="field" name="holders" type="number" min="1" max="5" value="1" required></label><p class="due-note">Usá datos inventados. El alta dura hasta que cierres o recargues el mockup.</p><div class="foot"><button type="button" data-act="close" class="btn">Cancelar</button><button class="primary">Crear carpeta</button></div></form>')}
function prompts(r){return r?['Resumir esta carpeta','¿Cuál es la exposición?','¿Qué informa el BCRA?']:['¿Qué vence esta semana?','¿Qué carpetas están en riesgo?','¿Cuántas están en comisión?']}
function assistant(r){const history=aiHistory.get(r?.id||('global-'+area))||[];
 return '<div class="stack"><div><span class="eyebrow">'+icons.Sparkles+' Asistente · Simulación</span><h3>'+(r?'Preguntá sobre esta carpeta':'Preguntá sobre la bandeja')+'</h3><p class="small">Respuestas de ejemplo con referencias a los datos ficticios.</p></div><div class="chips">'+prompts(r).map((p,i)=>'<button data-q="'+i+'">'+p+'</button>').join('')+'</div></div><div id="conversation" aria-live="polite">'+history.map(exchangeHtml).join('')+'</div><form class="aiform" id="ask"><input class="field" name="q" aria-label="Tu consulta" placeholder="Escribí una consulta…" maxlength="200" required><button class="primary" aria-label="Enviar consulta">'+icons.ArrowRight+'</button></form>'}
function exchangeHtml([q,a,ref]){return '<div class="answer"><div class="question">'+esc(q)+'</div>'+esc(a)+(ref?'<span class="small">Fuente de muestra · '+esc(ref)+'</span>':'')+'</div>'}
function reply(r,q){const ask=norm(q);
 if(r){
 if(/bcra|cheque|deud/.test(ask)){
   const data=sampleBcra(r);
   if(!data)return ['La consulta está pendiente.',r.id+' / BCRA'];
   return ['Para el primer titular se informan '+number(totalDebt(data.entidades))+' miles de ARS de deuda. La mayor situación es '+Math.max(...data.entidades.map(e=>e.situacion))+'. '+(data.checks.length?'Un cheque rechazado por defectos formales, con levantamiento informado.':'Sin registros informados de cheques rechazados.')+(r.holders>1?' El segundo titular tiene la consulta pendiente.':''),r.id+' / BCRA · '+periodLabel(data.periodo)];
 }
 if(/expos|saldo|limite|utiliz/.test(ask))return [r.limit===null?'Todavía no hay indicadores vinculados.':'El saldo utilizado es ARS '+r.used+' millones sobre un límite de ARS '+r.limit+' millones ('+Math.round(r.used/r.limit*100)+' %).',r.id+' / Power BI · octubre 2026'];
 if(/resum|carpeta|hito|responsable|etapa/.test(ask))return [r.name+' está en la etapa «'+states[r.stage]+'», a cargo de '+owners[r.owner]+'. '+(r.day===null?'Sin próximo hito registrado.':'Próximo hito el '+fullDate(r.day)+': '+r.event+'.'),r.id+' / Seguimiento'];
 }else{
 if(/venc|semana|hito|agenda/.test(ask)){const list=areaRows().filter(r=>r.day!==null&&r.day<=7).sort((a,b)=>a.day-b.day);return [list.length+' hitos en los próximos 7 días.\n'+list.map(r=>fullDate(r.day)+' · '+r.name+' — '+r.event).join('\n'),'Agenda / próximos 7 días']}
 if(/riesgo|comision|analisis|legales/.test(ask)){const st=/comision/.test(ask)?3:/riesgo/.test(ask)?1:/legales/.test(ask)?2:0;const list=areaRows().filter(r=>r.stage===st);return [list.length+' carpetas en la etapa «'+states[st]+'»: '+list.map(r=>r.name).join(', ')+'.','Bandeja / etapa']}
 }return ['Esta simulación cubre las consultas sugeridas. Elegí una para ver cómo se presentaría la respuesta con su fuente.','']}
function ask(q){if(!q.trim())return;const r=modal.open?active:null,key=r?.id||('global-'+area),exchange=[q,...reply(r,q)],history=aiHistory.get(key)||[];history.push(exchange);aiHistory.set(key,history);document.querySelector('#conversation').insertAdjacentHTML('beforeend',exchangeHtml(exchange));document.querySelector('#ask input').value='';document.querySelector('#ask input').focus()}
function reset(){search='';stage='';segment='';scope='Todas';page=0}
function changeView(i){view=i;active=null;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
 const el=e.target.closest('button,[data-id]');if(!el)return;const d=el.dataset;
 if(el.id==='theme'){document.documentElement.classList.toggle('dark');el.innerHTML=document.documentElement.classList.contains('dark')?icons.Sun:icons.Moon;return}
 if(d.area!==undefined){area=d.area;reset();render();document.querySelector('[data-area="'+area+'"]').focus();return}
 if(d.view!==undefined){changeView(Number(d.view));return}
 if(d.id){detail(rows.find(r=>r.id===d.id));return}
 if(d.tab!==undefined){detail(active,Number(d.tab));body.querySelector('[data-tab="'+d.tab+'"]').focus();return}
 if(d.q!==undefined){ask(prompts(modal.open?active:null)[Number(d.q)]);return}
 if(d.scope){scope=d.scope;page=0;results();document.querySelector('[data-scope="'+scope+'"]').focus();return}
 if(d.metric){reset();if(d.metric==='open')scope='En curso';else if(d.metric==='week')scope='Esta semana';else stage=d.metric;render();document.querySelector('#scopes').scrollIntoView({block:'nearest'});return}
 switch(d.act){
 case 'live-mode':liveState(active).mode=true;detail(active,2);body.querySelector('[name="cuit"]').focus();break;
 case 'live-example':requestLive(active,true);break;
 case 'live-exit':liveState(active).mode=false;detail(active,2);break;
 case 'edit-opinion': active.editing=true;detail(active,4);document.querySelector('#opinionform select').focus();break;
 case 'cancel-opinion': active.draft=null;active.editing=false;detail(active,4);break;
 case 'create':newForm();break;case 'close':modal.close();break;case 'ai':changeView(2);break;case 'agenda':changeView(1);break;case 'prev':page--;results();break;case 'next':page++;results();break;case 'reset':reset();render();break}
});
document.addEventListener('input',e=>{if(e.target.form?.id==='opinionform'){
   const form=e.target.form;form.elements.note.setCustomValidity('');
   active.draft={choice:form.elements.choice.value,note:form.elements.note.value};
 }
 if(e.target.id==='search'){search=e.target.value.trim();page=0;results()}});
document.addEventListener('change',e=>{
 if(e.target.id==='historyRange'){
   const live=liveState(active);
   if(live.mode&&live.report?.historial.state==='ok'){
     live.range=Number(e.target.value);
     document.querySelector('#historyChart').innerHTML=realHistory(live.report.historial.data,live.range);
     document.querySelector('#historyRange').focus();return;
   }
   active.bcraRange=Number(e.target.value);
   const data=sampleBcra(active,active.bcraHolder||0);
   document.querySelector('#historyChart').innerHTML=historyGraph(data.periodos,active.bcraRange);
   document.querySelector('#historyRange').focus();return;
 }
 if(e.target.id==='bcraHolder'){active.bcraHolder=Number(e.target.value);detail(active,2);document.querySelector('#bcraHolder').focus();return}
 if(e.target.id==='stage'||e.target.id==='seg'){if(e.target.id==='stage')stage=e.target.value;else segment=e.target.value;page=0;results()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(e.target.id==='ask'){ask(String(f.get('q')));return}
 if(e.target.id==='liveBcraForm'){requestLive(active,false);return}
 if(e.target.id==='opinionform'){
   const note=String(f.get('note')).trim();
   if(!note){const field=e.target.elements.note;field.setCustomValidity('Escribí los fundamentos del dictamen.');field.reportValidity();return}
   active.opinion={choice:String(f.get('choice')),note,author:owners.AL,time:new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short',timeZone:'America/Argentina/Buenos_Aires'}).format(new Date())};
   active.draft=null;active.editing=false;detail(active,4);body.querySelector('[data-act="edit-opinion"]').focus();return;
 }
 if(e.target.id==='newform'){const name=String(f.get('name')).trim();if(!name)return;const n=rows.length,r={id:'CR-'+(26081+n),name,added:true,area:String(f.get('area')),segment:String(f.get('segment')),holders:Number(f.get('holders')),stage:0,owner:'AL',index:n,day:null,event:'',limit:null,used:null};rows.unshift(r);if(area)area=r.area;modal.close();reset();render();detail(r);notify('Carpeta de prueba creada')}});
modal.addEventListener('click',e=>{if(e.target===modal){const b=modal.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)modal.close()}});
document.querySelector('#theme').innerHTML=icons.Moon;render();
function openLinkedCase(){
  const [key,section]=location.hash.slice(1).split('/');
  const record=rows.find(r=>r.id===key);
  if(record){area=record.area;render();liveState(record).mode=section==='real'&&location.origin===liveOrigin;detail(record,['real','bcra'].includes(section)?2:0);
    if(liveState(record).mode&&!liveState(record).report)requestLive(record,true)}
}
window.addEventListener('hashchange',openLinkedCase);openLinkedCase();
</script></body></html>
